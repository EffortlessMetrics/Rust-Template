version: 2
updates:
  - package-ecosystem: "cargo"
    directories:
      - "/"
      - "/crates/http-auth/fuzz"
      - "/crates/http-auth-mode/fuzz"
      - "/crates/http-auth-token/fuzz"
      - "/crates/http-body-format/fuzz"
      - "/crates/http-origin-rule/fuzz"
      - "/crates/http-bearer-token/fuzz"
      - "/crates/http-origin-prefix/fuzz"
      - "/crates/http-auth-verifier/fuzz"
      - "/crates/http-origin-policy/fuzz"
      - "/crates/http-origin-parser/fuzz"
      - "/crates/http-origin-boundary/fuzz"
      - "/crates/http-origin-subdomain/fuzz"
      - "/crates/http-task-status-parser/fuzz"
      - "/examples/brownfield-demo"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    open-pull-requests-limit: 5
